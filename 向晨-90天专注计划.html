  <article class="card article"><section id="g1"><span class="tag">第 01 章</span><h2>先弄清楚：你究竟要改变什么</h2><p>你想停止观看色情影片，并自主暂停手淫。这可以是你的个人选择。<strong>但性欲、性幻想、遗精并不是错误；手淫本身在医学上通常也是正常的性行为</strong>，没有证据表明适度手淫或射精会造成永久的智力或精力损伤。</p><p>真正值得干预的是：明明不想继续，仍然反复搜索内容、难以控制，继而影响睡眠、情绪和学习。不要仅凭次数给自己贴上“成瘾”或“失败者”的标签。</p><div class="quote">你的任务：停止被不想要的行为支配，而不是消灭身体的正常反应。</div></section>
  <section id="g2"><span class="tag">第 02 章</span><h2>识别你的宿舍夜间行为循环</h2><p><strong>触发：</strong>晚间洗漱 → 躺上床 → 拉上床帘 → 手机和耳机在手。</p><p><strong>念头与反应：</strong>无聊、疲倦、焦躁、想获得即时刺激，开始寻找熟悉的网站或资源。</p><p><strong>行为：</strong>浏览内容 → 习惯性手淫 → 短暂放松。</p><p><strong>后果：</strong>可能延迟睡眠，随后自责、担心第二天学习表现，下一次情绪不佳时又重复。</p><p>大脑可能已经将“床帘+手机+独处”和即时刺激联系在一起。解决方案不是与念头拼命争斗，而是<strong>在冲动强烈之前，改变触发环境</strong>。</p></section>
  <section id="g3"><span class="tag">第 03 章</span><h2>最优先的规则：手机不进床帘</h2><ol><li>睡前把手机放在宿舍书桌等安全位置充电，改用小闹钟叫醒自己。</li><li>移除色情内容快捷入口，设置成人内容限制、浏览器过滤和夜间 App 限额。</li><li>短视频平台取消关注刺激性内容，睡前至少45–60分钟不刷。</li><li>床帘内只做睡觉和放松的事。需要看资料，尽可能在书桌或图书馆完成。</li><li>若已经带手机上床，立即放回桌上；不需要证明自己可以拿着手机硬忍。</li></ol><div class="callout">屏蔽软件不是绝对防线，它只是让“想看 → 立即看”之间多出几步，帮助你重新作出选择。</div></section>
  <section id="g4"><span class="tag">第 04 章</span><h2>照着走：宿舍睡前60分钟</h2><p>当前设定的目标睡觉时间是 <strong>${esc(state.settings.bedtime)}</strong>。你可以在“设置”里调整，所有时间将自动更新。</p>${flowHTML()}<p class="spaced">如果约15–20分钟仍没有困意，尤其是烦躁越来越明显，在不打扰室友的情况下离开床进行安静活动，等困意回来再入睡；不要用色情内容“帮助入睡”。</p></section>
  <section id="g5"><span class="tag">第 05 章</span><h2>强烈冲动发生时：10分钟冲动冲浪</h2><p>冲动像海浪，可能变强，也会变化。观察它并不意味着赞同它。练习的重点是“感到强烈冲动，但不马上照做”。</p><ol><li><strong>命名：</strong>“我正在产生冲动，它不是命令。”</li><li><strong>离开触发位置：</strong>放下手机，离开床帘。</li><li><strong>放松：</strong>慢慢吸气约4秒、呼气约6秒，持续1–2分钟。</li><li><strong>观察：</strong>留意身体感受，不批评，不讨价还价。</li><li><strong>替换：</strong>看纸质书、喝水、轻柔拉伸或写下明天任务。</li></ol><button class="btn primary spaced" data-nav="rescue">进入10分钟应急模式 →</button></section>
  <section id="g6"><span class="tag">第 06 章</span><h2>白天：用真实的成长替代空转</h2><h3>学习优先</h3><p>对大三财务管理学生而言，每天先确定一项专业课任务，例如财务报表分析、管理会计、财务管理习题、证书备考或实习准备。按实际课程安排1–2段45–60分钟的专注学习时间，累积成就感。</p><h3>健身是支持，不是惩罚</h3><p>根据课表选择每周约3次健身，其他日子散步或休息。一次行为反复后不要加倍训练、熬夜学习或节食“赎罪”。</p><h3>降低短视频的占用</h3><p>可以先做14天试验：将娱乐性短视频限定在一个固定时段，例如晚饭后20分钟；夜间不刷。降低无意识滑动，而不是要求自己白天完全不碰手机。</p></section>
  <section id="g7"><span class="tag">第 07 章</span><h2>出现反复时，不要把它发展成连续失控</h2><p>如果某天重新打开了相关内容，<strong>即使已经开始，也可以立即停止</strong>。一次反复不抹去之前有效的练习。</p><ol><li>暂停，不继续刷，不说“反正已经失败了”。</li><li>记录：几点、在哪里、当时情绪怎样、前一个动作是什么。</li><li>只修补一个具体漏洞：比如把手机放回书桌，或取消夜间短视频入口。</li></ol><div class="quote">复盘像检查一道做错的专业题：寻找错误环节并修正，而不是攻击自己的价值。</div></section>
  <section id="g8"><span class="tag">第 08 章</span><h2>关于射精后疲惫，以及何时求助</h2><p>你描述的“第二天无精打采”值得认真关注，但不能直接归结于射精导致身体亏损。熬夜刷视频、睡眠不足、焦虑和自责都可能参与其中。</p><p>建议连续2–4周记录睡眠时间、行为发生时间与次日精力。如果睡眠充足仍然反复出现明显疲惫，或伴随发热感、头痛、肌肉酸痛等症状，去校医院、正规医院全科/泌尿外科或男科评估。射精后病态综合征（POIS）虽罕见，但持续明显的射精相关症状值得就诊，而不是自行诊断。</p><p><strong>因为这一困扰已持续多年，并影响生活，建议本周主动联系学校心理健康教育中心。</strong>可以请专业人员帮助识别诱因、处理焦虑和失控感，学习认知行为治疗等方法。咨询前可先了解保密规定。</p><div class="callout warn">不要自行使用所谓“戒色药”“补肾药”，也不要通过睡眠剥夺、过度训练或自我惩罚压制性欲。本工具不是医学诊断。</div></section>
  <section id="g9"><span class="tag">第 09 章</span><h2>随时重读的五条行动守则</h2><ol><li>晚上先管环境，再谈意志力。</li><li>冲动不是命令；先离开床帘，再做10分钟练习。</li><li>白天优先把精力留给专业课、运动和真实生活。</li><li>打卡反映行为，不评价你这个人。</li><li>出现反复就修补漏洞；反复持续困扰时寻求专业支持。</li></ol><button class="btn outline spaced" data-action="print">打印 / 保存这一页方法论</button></section></article></div>`}
  function insights(){const vals=pastSeven(),rate=sevenRate(),weekly=vals.map(k=>({k,c:checkCount(k),data:state.days[k],before:k<state.settings.startDate})),recentLogs=state.logs.slice().reverse().slice(0,6),recentUrges=state.urgeLogs.slice().reverse().slice(0,5);return `<div class="section-title"><div class="page-eyebrow">REFLECTION & INSIGHTS</div><h1>记录改善，不审判自己。</h1><p>关注你真正能控制的行为：手机隔离、学习、放松和应对冲动。未勾选不自动认定为反复。</p></div><div class="summary-cards"><div class="metric"><div class="label">已确认未主动浏览</div><div class="num">${checkedDays('porn')}<span class="unit">天</span></div><div class="foot">仅计算明确勾选的日期</div></div><div class="metric"><div class="label">已完成手机隔离</div><div class="num">${checkedDays('phone')}<span class="unit">天</span></div><div class="foot">从环境入手更可靠</div></div><div class="metric"><div class="label">累计专注学习</div><div class="num">${Object.values(state.days).reduce((s,x)=>s+(Number(x.focusMinutes)||0),0)}<span class="unit">分钟</span></div><div class="foot">学习成果是计划的核心</div></div></div>
  <div class="grid two"><div class="card"><div class="card-title"><h3>最近7天行动完成情况</h3><span class="tag neutral">已记录项目完成率 ${rate===null?'—':rate+'%'}</span></div><div class="bar-chart">${weekly.map(x=>`<div class="bar-wrap" title="${fmtDate(x.k)}：已完成 ${x.c}/5 项"><div class="bar-bg"><div class="bar-fill" style="height:${x.before?0:x.c/5*100}%"></div></div><small>${x.c}/5</small><span>${new Date(x.k+'T12:00:00').getDate()}日</span></div>`).join('')}</div><p class="tiny separated">灰色或空白只表示没有完成记录，不代表该日发生了任何特定行为。</p></div>
  <div class="card"><div class="card-title"><h3>你已经积累的经验</h3><span class="tag">${state.urgeLogs.length} 次练习</span></div>${recentUrges.length?recentUrges.map(l=>`<div class="history-item"><div class="head"><b>${fmtDate(l.date)} · ${esc(l.trigger)}</b><span class="tag neutral">${l.start}/10 → ${l.end}/10</span></div><p>进行了冲动应对练习；冲动强弱可以变化，完成练习本身也有意义。</p></div>`).join(''):'<p class="muted small">还没有冲动应对记录。下次出现冲动时，可以打开“应急”进行第一次练习。</p>'}<button class="btn outline sm spaced" data-nav="rescue">开始一次练习</button></div></div>
  <div class="grid equal topgap"><div class="card"><div class="card-title"><h3>温和的反复复盘</h3><span class="tag gold">不清零 · 不惩罚</span></div><p class="small muted">记录一次不符合自己目标的行为，目的是识别诱因、修补环境，而不是制造羞耻感。</p><div class="field spaced"><label>出现了什么情况</label><div class="quickrow">${['重新打开色情内容','发生了计划外的手淫','夜间带手机上床','其他偏离计划的行为'].map(x=>`<button class="choice ${slipType===x?'active':''}" data-slip-type="${x}">${x}</button>`).join('')}</div></div><div class="field"><label>最直接的触发因素</label><div class="quickrow">${['睡前独处','短视频刺激','压力或焦虑','无聊','熬夜','其他'].map(x=>`<button class="choice ${slipTrigger===x?'active':''}" data-slip-trigger="${x}">${x}</button>`).join('')}</div></div><div class="field"><label for="slip-fix">下次我能修补的一个具体步骤</label><textarea id="slip-fix" class="textarea" placeholder="例如：22:45 手机放在书桌，床帘里只留纸质书。" maxlength="400"></textarea></div><button class="btn primary spaced" data-action="log-slip">保存复盘</button></div>
  <div class="card"><div class="card-title"><h3>最近的复盘记录</h3><span class="tag neutral">仅本机可见</span></div>${recentLogs.length?recentLogs.map(x=>`<div class="history-item"><div class="head"><b>${fmtDate(x.date)} · ${esc(x.type)}</b><span class="tag neutral">${esc(x.trigger)}</span></div><p>${esc(x.fix||'下次更早识别诱因，减少触发机会。')}</p></div>`).join(''):'<p class="small muted">暂无反复复盘记录。记录与否由你决定；不需要人为追求“完美记录”。</p>'}<div class="callout spaced">建议每周花5分钟想想：哪天手机成功留在床外？什么情况下冲动更强？学习和睡眠有没有改善？下周只改进一件事。</div></div></div>`}
  function settings(){let s=state.settings;return `<div class="section-title"><div class="page-eyebrow">PERSONALIZATION & PRIVACY</div><h1>把计划调整为你的作息。</h1><p>参数在本机保存，无需注册。你可以按课程表、健身时间和宿舍熄灯情况调整。</p></div>
  <div class="grid equal"><div class="card"><div class="card-title"><h3>我的计划设置</h3><span class="tag">可随时修改</span></div><div class="settings-row"><div class="field"><label for="start-date">90天计划开始日期</label><input id="start-date" type="date" class="dateinput" value="${esc(s.startDate)}" max="${todayKey()}"></div><div class="field"><label for="bedtime">目标睡觉时间</label><input id="bedtime" type="time" class="textinput" value="${esc(s.bedtime)}"></div></div><div class="field"><label for="focus-default">每天一次专注学习时长（分钟）</label><input id="focus-default" type="number" min="15" max="180" class="textinput" value="${Number(s.focusMinutes)||50}"></div><div class="field"><label for="goal-text">我最重要的学习目标</label><input id="goal-text" maxlength="150" class="textinput" value="${esc(s.studyGoal)}"></div><div class="field"><label>通常健身的星期（允许随时更改）</label><div class="weekday-buttons">${[1,2,3,4,5,6,0].map(i=>`<button class="weekday-btn ${s.gymDays.includes(i)?'on':''}" data-weekday="${i}"> ${WEEKDAYS[i]} </button>`).join('')}</div><div class="help">默认每周3次，忙碌或恢复不佳时适量减少也可以。</div></div><button class="btn primary spaced" data-action="save-settings">保存我的作息设置</button></div>
  <div class="card"><div class="card-title"><h3>我的隐私与数据</h3><span class="tag">本机优先</span></div><div class="privacy-note"><span style="font-size:25px">♧</span><div><strong>无需账号、不连接统计服务器</strong><p>所有打卡、反复复盘与学习记录只保存在当前浏览器的本地存储中。不会自动同步到其他设备。</p></div></div><div class="btnrow spaced"><button class="btn outline" data-action="export">↓ 导出全部备份</button><button class="btn outline" data-action="import">↑ 从备份恢复</button></div><div class="callout spaced">清理浏览器数据、使用无痕模式或更换设备可能使记录丢失。浏览器本地存储与导出的备份都没有加密，能够使用同一浏览器或拿到备份的人可能看到记录。建议给设备设置锁屏，不在共享设备使用，并定期安全备份。</div><hr class="divider"><button class="btn danger" data-action="clear">清空本机全部数据</button><p class="help spaced">清空需二次确认且不可撤销，请先导出备份。</p></div></div>
  <div class="card topgap"><div class="card-title"><h3>关于这款小工具</h3><span class="tag neutral">向晨 v1.0</span></div><p class="small muted">这是一款可离线使用的手机友好型网页应用。它不将正常性欲或手淫医学化，尊重你自愿设立的个人目标，强调睡前环境设计、专业课学习、冲动管理与温和复盘。</p><p class="small muted spaced">如果行为持续失控、情绪痛苦明显或身体疲惫长期不缓解，应联系学校心理咨询中心及正规医疗机构。90天不是保证治愈的期限。</p><p class="small muted spaced">把它放到 HTTPS 静态网站后，可以通过浏览器“添加到主屏幕”作为网页小程序使用。首次访问后可在部分设备上离线打开。</p></div>`}
  const screens={home,today,rescue,guide,insights,settings};
  function renderScreen(name){document.getElementById('screen-'+name).innerHTML=screens[name]();if(name==='rescue')updateTimerFace()}
  function show(name,scroll=true){if(!screens[name])name='home';view=name;renderScreen(name);document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==='screen-'+name));document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===name));const titles={home:'专注生活 · 每天进步一点点',today:'我的每日行动',rescue:'应对当下，找回选择',guide:'我的个人方法手册',insights:'进步值得被看见',settings:'私人设置与数据备份'};document.getElementById('top-eyebrow').textContent=titles[name];if(location.hash!=='#'+name)history.replaceState(null,'','#'+name);if(scroll)window.scrollTo({top:0,behavior:'instant'})}
  function rerender(){renderScreen(view);if(view==='home')renderScreen('home')}
  function formatTimer(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  function updateTimerFace(){const f=document.getElementById('timer-face'),b=document.getElementById('timer-toggle');if(f)f.textContent=formatTimer(timeLeft);if(b)b.textContent=timerRunning?'暂停计时':timeLeft===600?'开始10分钟':'继续计时'}
  function timerToggle(){timerRunning=!timerRunning;if(timerRunning){timerId=setInterval(()=>{timeLeft=Math.max(0,timeLeft-1);updateTimerFace();if(timeLeft===0){clearInterval(timerId);timerRunning=false;updateTimerFace();toast('10分钟结束。你完成了一次延迟回应练习。')}},1000)}else clearInterval(timerId);updateTimerFace()}
  function changeCheck(t){const x=entry(t.dataset.date);x.checks[t.dataset.check]=t.checked;save();if(view==='today')renderScreen('today');else if(view==='home')renderScreen('home');toast(t.checked?'已记录这项行动':'已取消此项勾选')}
  function cover(){privacyOn=!privacyOn;let c=document.getElementById('privacy-cover');c.classList.toggle('active',privacyOn);c.setAttribute('aria-hidden',privacyOn?'false':'true');if(privacyOn)document.querySelector('#privacy-cover button')?.focus()}
  function download(name,mime,content){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');if(nav){show(nav.dataset.nav);return}
    const action=e.target.closest('[data-action]');if(action){switch(action.dataset.action){
      case 'privacy':cover();break;
      case 'timer-toggle':timerToggle();break;
      case 'timer-reset':clearInterval(timerId);timerRunning=false;timeLeft=600;updateTimerFace();break;
      case 'save-urge':state.urgeLogs.push({date:todayKey(),time:new Date().toISOString(),start:urgeStart,end:urgeEnd,trigger});save();toast('这次冲动应对练习已记录。');break;
      case 'log-slip':{const fix=document.getElementById('slip-fix')?.value||'';state.logs.push({date:todayKey(),time:new Date().toISOString(),type:slipType,trigger:slipTrigger,fix:fix.slice(0,400)});save();renderScreen('insights');toast('复盘已保存。下次只需修补一个漏洞。');break}
      case 'save-settings':{const start=document.getElementById('start-date').value,bed=document.getElementById('bedtime').value,focus=Number(document.getElementById('focus-default').value),goal=document.getElementById('goal-text').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||start>todayKey()||!/^\d{2}:\d{2}$/.test(bed)||focus<15||focus>180){toast('请检查日期、睡眠时间及学习时长（15–180分钟）。');break}state.settings={...state.settings,startDate:start,bedtime:bed,focusMinutes:focus,studyGoal:goal||'完成一项专业课重点任务'};selectedDate=todayKey();save();show('settings',false);toast('个人作息已更新。');break}
      case 'export':download('向晨-私密备份-'+todayKey()+'.json','application/json;charset=utf-8',JSON.stringify(state,null,2));toast('已下载备份。请妥善保管。');break;
      case 'import':document.getElementById('import-file').click();break;
      case 'clear':if(confirm('确定清空本机全部打卡、复盘及设置吗？此操作无法撤销。')&&confirm('请最后确认：你是否已经备份，需要永久清空全部本机记录？')){state=template();selectedDate=todayKey();save();show('home');toast('本机记录已清空。')}break;
      case 'print':window.print();break;
      case 'check-label':{const t=action;const x=entry(t.dataset.date);x.checks[t.dataset.key]=!x.checks[t.dataset.key];save();renderScreen(view);toast('已更新打卡');break}
    }return}
    const ex=e.target.closest('[data-exercise]');if(ex){entry(selectedDate).exercise=ex.dataset.exercise;save();renderScreen('today');toast('今日运动记录已更新');return}
    const tr=e.target.closest('[data-trigger]');if(tr){trigger=tr.dataset.trigger;renderScreen('rescue');return}
    const st=e.target.closest('[data-slip-type]');if(st){const v=document.getElementById('slip-fix')?.value;slipType=st.dataset.slipType;renderScreen('insights');if(v!==undefined)document.getElementById('slip-fix').value=v;return}
    const sg=e.target.closest('[data-slip-trigger]');if(sg){const v=document.getElementById('slip-fix')?.value;slipTrigger=sg.dataset.slipTrigger;renderScreen('insights');if(v!==undefined)document.getElementById('slip-fix').value=v;return}
    const wd=e.target.closest('[data-weekday]');if(wd){const d=Number(wd.dataset.weekday);state.settings.gymDays=state.settings.gymDays.includes(d)?state.settings.gymDays.filter(x=>x!==d):[...state.settings.gymDays,d];wd.classList.toggle('on');return}
    const scroll=e.target.closest('[data-scroll]');if(scroll){document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  });
  document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-check]'))changeCheck(t);else if(t.id==='date-select'){selectedDate=t.value;if(!actForDay(selectedDate))selectedDate=todayKey();renderScreen('today')}});
  document.addEventListener('input',e=>{const t=e.target;
    if(t.matches('[data-field]')){const d=entry(selectedDate),k=t.dataset.field;if(k==='focusMinutes')d[k]=Math.min(900,Math.max(0,Number(t.value)||0));else if(k==='mood'){d[k]=Number(t.value);document.getElementById('mood-label').textContent=d[k]+'/10'}else d[k]=t.value;save()}
    else if(t.matches('[data-urge]')){if(t.dataset.urge==='start'){urgeStart=Number(t.value);document.getElementById('urge-start-label').textContent=urgeStart+'/10'}else{urgeEnd=Number(t.value);document.getElementById('urge-end-label').textContent=urgeEnd+'/10'}}
  });
  document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.version!==1||!obj.settings||typeof obj.settings.startDate!=='string'||!obj.days||typeof obj.days!=='object'||Array.isArray(obj.days)||!Array.isArray(obj.settings.gymDays)||!Array.isArray(obj.logs)||!Array.isArray(obj.urgeLogs))throw Error('invalid');if(confirm('导入备份会覆盖本机现有记录，确认继续吗？')){state=obj;selectedDate=todayKey();save();show('home');toast('备份恢复成功。')}}catch(err){toast('无法读取备份文件，请选择本应用导出的 JSON 文件。')}e.target.value=''});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!e.repeat){cover()}}});
  document.getElementById('header-date').textContent=fmtDate(todayKey(),true)+' · 星期'+WEEKDAYS[new Date().getDay()];
  show((location.hash||'#home').slice(1),false);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
